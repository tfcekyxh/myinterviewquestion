<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>面试题背诵 · 界面原型</title>
<style>
:root{
  --primary:#2563EB; --primary-soft:#EFF4FF;
  --success:#0E9F6E; --success-soft:#E9F7F1;
  --danger:#E5484D; --danger-soft:#FDEDED;
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#F0F2F5;
  --t1:#141A23; --t2:#69737F; --t3:#98A1AC; --line:#E6E9EE;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,"PingFang SC","SF Pro Text","Helvetica Neue",sans-serif;
  background:#EDEFF3;color:var(--t1);display:flex;flex-direction:column;min-height:100vh;
}
.topbar{padding:18px 20px 10px}
.brand{font-size:13px;color:var(--t2);margin-bottom:12px}
.brand b{color:var(--t1);font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;
  border:.5px solid var(--line);background:var(--surface);color:var(--t2);cursor:pointer;white-space:nowrap
}
.tab.on{background:var(--t1);border-color:var(--t1);color:#fff}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 20px 28px}

.device{
  width:390px;height:min(844px,calc(100vh - 168px));flex:none;background:var(--bg);
  border-radius:44px;border:10px solid #161A22;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(20,26,35,.18)
}
.statusbar{
  flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px 0 30px;font-size:13px;font-weight:500;background:var(--bg)
}
.sb-icons{display:flex;align-items:center;gap:5px}
.sb-icons i{display:block;background:var(--t1);border-radius:1px}
.sb-sig{width:15px;height:9px;clip-path:polygon(0 70%,18% 70%,18% 100%,0 100%,0 70%,28% 45%,46% 45%,46% 100%,28% 100%,28% 45%,56% 22%,74% 22%,74% 100%,56% 100%,56% 22%,84% 0,100% 0,100% 100%,84% 100%)}
.sb-bat{width:22px;height:10px;border:1px solid var(--t1);background:none!important;border-radius:2.5px;position:relative}
.sb-bat::after{content:"";position:absolute;inset:1.5px;width:70%;background:var(--t1);border-radius:1px}

#app{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.home-ind{flex:none;height:22px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.home-ind::after{content:"";width:134px;height:5px;border-radius:3px;background:var(--t1);opacity:.22}

.navbar{flex:none;height:56px;display:flex;align-items:center;gap:4px;padding:0 12px;background:var(--bg)}
.nav-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:var(--t1);cursor:pointer;border-radius:10px}
.nav-title{font-size:17px;font-weight:600;flex:1}
.nav-title.center{text-align:center;padding-right:36px}

.content{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:20px}
.content.tight{gap:12px}
.bottombar{flex:none;padding:12px 20px 20px;display:flex;gap:12px;background:var(--bg)}

.btn{font:inherit;font-size:15px;font-weight:500;height:50px;border-radius:var(--r-m);border:.5px solid var(--line);background:var(--surface);color:var(--t1);cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-secondary{background:var(--surface)}
.btn-ghost{background:none;border:0;color:var(--primary);font-size:14px;flex:none;padding:0}
.btn[disabled]{opacity:.4;cursor:default}
.btn-danger-text{color:var(--danger)}

.card{background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-l);padding:16px;box-shadow:0 1px 2px rgba(20,26,35,.04)}
.card-plain{background:var(--surface);border-radius:var(--r-l);padding:16px}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{background:var(--surface);border-radius:var(--r-m);padding:14px 8px;text-align:center}
.metric b{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.metric span{font-size:11px;color:var(--t3)}

.lbl{font-size:12px;color:var(--t2);margin:0 0 6px 2px}
.input{width:100%;height:50px;border-radius:var(--r-m);border:.5px solid var(--line);background:var(--surface);padding:0 14px;font:inherit;font-size:15px;color:var(--t1)}
.input::placeholder{color:var(--t3)}
.field{display:flex;flex-direction:column}

.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progress i{display:block;height:100%;border-radius:3px;background:var(--primary)}
.progress.thin{height:3px;border-radius:0;background:var(--surface-2)}
.progress.thin i{border-radius:0}

.h1{font-size:28px;line-height:36px;font-weight:600;margin:0}
.h2{font-size:17px;line-height:26px;font-weight:600;margin:0}
.q{font-size:22px;line-height:32px;font-weight:600;margin:0}
.a{font-size:15px;line-height:26px;color:var(--t2);margin:0;white-space:pre-wrap}
.cap{font-size:13px;line-height:20px;color:var(--t2);margin:0}
.micro{font-size:11px;line-height:16px;color:var(--t3);margin:0}
.divider{height:.5px;background:var(--line);margin:14px 0}

.chips{display:flex;gap:8px}
.chip{font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;border:.5px solid var(--line);background:var(--surface);color:var(--t2);cursor:pointer}
.chip.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:500}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-t{display:flex;align-items:center;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}

.ph{border:1px dashed #C9D0DA;border-radius:var(--r-l);background:var(--surface);padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--t3);cursor:pointer}
.ph svg{color:var(--t3)}

.info{border-radius:var(--r-m);padding:12px 14px;font-size:13px;line-height:20px;background:var(--primary-soft);color:var(--primary)}
.info.err{background:var(--danger-soft);color:var(--danger)}
.info.warn{background:#FDF6E9;color:#8A6100}

.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:var(--r-l);border:.5px solid var(--line);background:var(--surface);cursor:pointer}
.opt.on{border-color:var(--primary);background:var(--primary-soft)}
.opt.on .opt-t{color:var(--primary)}
.opt-t{font-size:15px;font-weight:500;margin:0 0 3px}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.opt.on .radio{border-color:var(--primary);background:radial-gradient(circle,#fff 0 4px,var(--primary) 4px)}
.opt.off{opacity:.45;cursor:default}

.answer-hidden{
  border-radius:var(--r-l);background:var(--surface-2);min-height:132px;
  display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:13px
}

.mic-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0 4px}
.mic{width:88px;height:88px;border-radius:50%;border:none;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font:inherit}
.mic.rec{background:var(--danger)}
.mic.ghost{background:var(--surface);border:1.5px solid var(--primary);color:var(--primary)}

.rec-bar{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--danger-soft);border-radius:var(--r-m);padding:10px 14px;color:var(--danger);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--danger)}
.wave{display:flex;align-items:center;justify-content:center;gap:3px;height:34px}
.wave span{display:block;width:2px;border-radius:1px;background:var(--danger)}

.play{display:flex;align-items:center;gap:12px}
.play-btn{width:38px;height:38px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.play-track{flex:1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.play-track i{display:block;height:100%;width:34%;background:var(--primary)}

.list{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-l);overflow:hidden;border:.5px solid var(--line)}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;font-size:15px}
.list-item + .list-item{border-top:.5px solid var(--line)}
.list-item .cap{margin-top:2px}

.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex:none}
.mono{font-variant-numeric:tabular-nums}

@media (max-width:520px){
  body{height:100vh;overflow:hidden}
  .topbar{padding:8px 12px 6px}
  .brand{display:none}
  .stage{padding:0}
  .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
}
</style>
</head>

<script>
function wave(n){
  var out = [];
  for (var i = 0; i < n; i++){
    var v = 8 + Math.round(Math.abs(Math.sin(i * 1.7)) * 15);
    out.push('<span style="height:' + v + 'px"></span>');
  }
  return out.join('');
}

var order = Object.keys(screens);
var tabs = document.getElementById("tabs");
var app = document.getElementById("app");

order.forEach(function(name, i){
  var b = document.createElement("button");
  b.className = "tab" + (i === 0 ? " on" : "");
  b.textContent = name;
  b.onclick = function(){
    Array.prototype.forEach.call(tabs.children, function(c){ c.classList.remove("on"); });
    b.classList.add("on");
    app.innerHTML = screens[name];
    var sc = app.querySelector(".content");
    if (sc) sc.scrollTop = 0;
  };
  tabs.appendChild(b);
});

app.innerHTML = screens[order[0]];
